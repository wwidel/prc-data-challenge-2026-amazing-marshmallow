<text class="cap" x="20" y="958" text-anchor="start">Weights are the final submission&#x27;s. Red arrows: modes6; violet: modes5; grey: modes; dashed: r14&#x27;s value for every Rome row. The build also fits a seventh member, t05s; NNLS gives it weight 0 everywhere, so it is not drawn.</text>
