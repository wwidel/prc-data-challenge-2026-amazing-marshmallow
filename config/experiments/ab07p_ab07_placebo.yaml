name: ab07p_ab07_placebo
description: |
  Control: ab07 plus the placebo block (three noise columns keyed on the movement ID). Question:
  how far does adding a block that carries nothing move ab07's per-month score, with
  feature_fraction 0.6 redrawing every tree's columns? Baseline: ab07_ab02_adsb_calib on
  final_pairs, same code: trimmed RMSE without Rome 200.89 (Jan 187.08, Feb 232.86, Jun 170.96,
  Jul 211.84). Population: all departures of the four held-out months. Reading: no gate; its
  per-month deltas (a130_member_months.py) are the noise floor for ab07s's screen (Jan −0.11,
  Feb −1.64, Jun +0.10, Jul +0.18), and its swap in a129 that for the stack's gate.
features:
- calendar
- offblock
- taxi_in
- flight_match
- runway_config
- congestion
- consistency
- modes
- runway_history
- weather
- stand_geometry
- stand_runway_lo
- modes5
- arrival_regime
- context_window
- gate_retention
- eurocontrol_daily
- adsb
- adsb_calib
- placebo
train_label_cap: 10800
model:
  kind: lgbm
  params:
    learning_rate: 0.03
    num_leaves: 511
    min_data_in_leaf: 30
    max_bin: 511
    feature_fraction: 0.6
    lambda_l2: 50.0
    num_boost_round: 4000
    early_stopping_rounds: 200
folds: final_pairs
tags:
  family: control
