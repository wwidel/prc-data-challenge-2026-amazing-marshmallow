name: ab07_ab02_adsb_calib
description: |
  The q04 recipe plus five blocks: context_window, gate_retention and eurocontrol_daily (ideas
  from team outgoing-boat), adsb (taxi evidence from adsb.lol traces) and adsb_calib (the trace
  re-expressed against its own airport-month, so a model that learnt 2025's receiver coverage is
  not misled by 2026's). The coverage change is a 2026 property, so 2025 CV cannot show what
  adsb_calib is for. CV (Jan / Jul 2025 folds), trimmed RMSE without Rome: 200.66
  (186.96 / 211.13).
features:
- calendar
- offblock
- taxi_in
- flight_match
- runway_config
- congestion
- consistency
- modes
- runway_history
- weather
- stand_geometry
- stand_runway_lo
- modes5
- arrival_regime
- context_window
- gate_retention
- eurocontrol_daily
- adsb
- adsb_calib
train_label_cap: 10800
model:
  kind: lgbm
  params:
    learning_rate: 0.03
    num_leaves: 511
    min_data_in_leaf: 30
    max_bin: 511
    feature_fraction: 0.6
    lambda_l2: 50.0
    num_boost_round: 4000
    early_stopping_rounds: 200
folds: seasonal
tags:
  family: adsb_derived
