name: cb04r_cb04_seed1
description: |
  Replicate: cb04_cb03_adsb_calib with one change, its random seed (random_seed = 1 instead of 0).
  Question: does a second draw of the same recipe, beside the first, lower the stack's error?
  Baseline: cb04_cb03_adsb_calib on final_pairs: 198.54 (Jan 186.99, Feb 222.65, Jun 172.21, Jul
  211.42).
  Population: all departures of the four held-out months. Reading, fixed before running: judged in
  the stack (a129) as an addition beside cb04_cb03_adsb_calib, with the other replicates and
  alone; accepted only if the stack's trimmed RMSE without Rome improves on at least 3 of the 4
  months and by at least 0.3 s over the four.
features:
- calendar
- offblock
- stand_runway
- taxi_in
- flight_match
- runway_config
- congestion
- consistency
- modes
- runway_history
- weather
- stand_geometry
- modes6
- context_window
- gate_retention
- eurocontrol_daily
- adsb
- adsb_calib
train_label_cap: 10800
model:
  kind: catboost
  params:
    iterations: 3000
    learning_rate: 0.05
    depth: 10
    thread_count: 8
    border_count: 1024
    random_seed: 1
folds: final_pairs
tags:
  family: seed
