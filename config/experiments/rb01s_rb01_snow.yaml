name: rb01s_rb01_snow
description: |
  rb01_lirf_route_ab02 plus the snow block, nothing else changed. Baseline: rb01_lirf_route_ab02 on final_pairs.
  Judged in the stack (a129) with the other snow variants, NNLS weights fitted on the other pair:
  accepted only if the stack's trimmed RMSE without Rome improves on at least 3 of the 4 months
  and by at least 0.3 s over the four. Motivation: q04s (q04 + snow) moved February by -5.68 s
  and no month by more than +0.01 (a130, 2026-10-08).
features:
- calendar
- offblock
- taxi_in
- flight_match
- runway_config
- congestion
- consistency
- modes
- runway_history
- weather
- stand_geometry
- stand_runway_lo
- modes5
- arrival_regime
- context_window
- gate_retention
- eurocontrol_daily
- adsb
- snow
train_label_cap: 10800
model:
  kind: routed
  params:
    by: airport
    routes:
      rome:
      - LIRF
    foreign_weight: 0.1
    min_rows: 3000
    base:
      kind: lgbm
      params:
        learning_rate: 0.03
        num_leaves: 511
        min_data_in_leaf: 30
        max_bin: 511
        feature_fraction: 0.6
        lambda_l2: 50.0
        num_boost_round: 4000
        early_stopping_rounds: 200
folds: final_pairs
tags:
  family: snow
