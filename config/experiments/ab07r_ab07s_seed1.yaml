name: ab07r_ab07s_seed1
description: |
  Replicate: ab07s_ab07_snow with one change, its random seed (seed = 1 instead of 0).
  Question: does a second draw of the same recipe, beside the first, lower the stack's error?
  Baseline: ab07s_ab07_snow on final_pairs: 200.54 (Jan 186.97, Feb 231.23, Jun 171.06, Jul
  212.02).
  Population: all departures of the four held-out months. Reading, fixed before running: judged in
  the stack (a129) as an addition beside ab07s_ab07_snow, with the other replicates and alone;
  accepted only if the stack's trimmed RMSE without Rome improves on at least 3 of the 4 months
  and by at least 0.3 s over the four.
features:
- calendar
- offblock
- taxi_in
- flight_match
- runway_config
- congestion
- consistency
- modes
- runway_history
- weather
- stand_geometry
- stand_runway_lo
- modes5
- arrival_regime
- context_window
- gate_retention
- eurocontrol_daily
- adsb
- adsb_calib
- snow
train_label_cap: 10800
model:
  kind: lgbm
  params:
    learning_rate: 0.03
    num_leaves: 511
    min_data_in_leaf: 30
    max_bin: 511
    feature_fraction: 0.6
    lambda_l2: 50.0
    num_boost_round: 4000
    early_stopping_rounds: 200
    seed: 1
folds: final_pairs
tags:
  family: seed
