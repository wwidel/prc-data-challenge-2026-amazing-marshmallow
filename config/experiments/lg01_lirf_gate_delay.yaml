name: lg01_lirf_gate_delay
description: |
  Gate-delay model for Rome, after team OpenAir: taxi-out T = D - G, with D = takeoff - schedule
  (known on the ranking rows) and G the gate delay, which is what is learnt. Fitted on LIRF
  departures only, as CatBoost on the residual from sc_gap_sec (an offset model, so the fit is
  -G), on r14's eight blocks plus context_window, arrival_regime and opdi (the same aircraft's
  ground time from OPDI flight lists). Serves only the LIRF NM-unmatched rows, through the
  override written by scripts/analysis/a125_lirf_um_override.py. The other airports get a
  constant, so the runner's pooled numbers for this member mean nothing.
features:
- calendar
- offblock
- stand_runway
- taxi_in
- flight_match
- runway_config
- schedule
- congestion
- context_window
- arrival_regime
- opdi
model:
  kind: subset
  params:
    by: airport
    values:
    - LIRF
    base:
      kind: offset
      params:
        column: sc_gap_sec
        base:
          kind: catboost
          params:
            iterations: 1200
            learning_rate: 0.04
            depth: 8
            l2_leaf_reg: 5
            thread_count: 8
folds: seasonal
tags:
  family: openair
