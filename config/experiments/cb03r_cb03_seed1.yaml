name: cb03r_cb03_seed1
description: |
  Replicate: cb03_k20_combo_adsb with one change, its random seed (random_seed = 1 instead of 0).
  Question: does a second draw of the same recipe, beside the first, lower the stack's error?
  Baseline: cb03_k20_combo_adsb on final_pairs: 198.20 (Jan 186.96, Feb 221.47, Jun 172.15, Jul
  211.30).
  Population: all departures of the four held-out months. Reading, fixed before running: judged in
  the stack (a129) as an addition beside cb03_k20_combo_adsb, with the other replicates and alone;
  accepted only if the stack's trimmed RMSE without Rome improves on at least 3 of the 4 months
  and by at least 0.3 s over the four.
features:
- calendar
- offblock
- stand_runway
- taxi_in
- flight_match
- runway_config
- congestion
- consistency
- modes
- runway_history
- weather
- stand_geometry
- modes6
- context_window
- gate_retention
- eurocontrol_daily
- adsb
train_label_cap: 10800
model:
  kind: catboost
  params:
    iterations: 3000
    learning_rate: 0.05
    depth: 10
    thread_count: 8
    border_count: 1024
    random_seed: 1
folds: final_pairs
tags:
  family: seed
