name: cb04_cb03_adsb_calib
description: |
  cb03 plus the adsb_calib block (see ab07). CV (Jan / Jul 2025 folds), trimmed RMSE without
  Rome: 200.35 (186.76 / 210.73).
features:
- calendar
- offblock
- stand_runway
- taxi_in
- flight_match
- runway_config
- congestion
- consistency
- modes
- runway_history
- weather
- stand_geometry
- modes6
- context_window
- gate_retention
- eurocontrol_daily
- adsb
- adsb_calib
train_label_cap: 10800
model:
  kind: catboost
  params:
    iterations: 3000
    learning_rate: 0.05
    depth: 10
    thread_count: 8
    border_count: 1024
folds: seasonal
tags:
  family: outgoing_boat
