name: w08_x36_all_months
description: |
  x36 -- the best LightGBM of the leaderboard phase and the modes5 host in every shipped stack since
  v31 -- cross-validated on all twelve months of 2025, each fold trained on the other eleven. Every
  member was selected on Jan + Jul, and the final phase also ranks February and June, so this gives
  the per-month error profile of that family.

  Nothing is selected on this. Its out-of-fold predictions are the input of a127, a128 and a131
  (scripts/analysis/). x36 itself is not in this repository; this config is its recipe.
features: [calendar, offblock, taxi_in, flight_match, runway_config, congestion, consistency, modes, runway_history, weather, stand_geometry, stand_runway_lo, modes5]
train_label_cap: 10800
model:
  kind: lgbm
  params:
    learning_rate: 0.03
    num_leaves: 511
    min_data_in_leaf: 100
    max_bin: 511
    feature_fraction: 0.6
    lambda_l2: 50.0
    num_boost_round: 4000
    early_stopping_rounds: 200
folds: all_months
tags:
  family: validation
