name: hp_ab07s_ff04
description: |
  ab07s's recipe (ab07 + the snow block) with one change:
  feature fraction 0.4 (0.6 was the lowest tried).
  Baseline: ab07s_ab07_snow on final_pairs, same code: trimmed RMSE without Rome 200.54
  (Jan 186.97, Feb 231.23, Jun 171.06, Jul 212.02). A copy of hp_ab07_ff04 on the snow
  member, so the result applies to the composition the snow test chose.
  Judged in the stack (a129) as a replacement for ab07s and as an addition beside it, NNLS weights
  fitted on the other pair: accepted only if the stack's trimmed RMSE without Rome improves on
  at least 3 of the 4 months and by at least 0.3 s over the four.
features:
- calendar
- offblock
- taxi_in
- flight_match
- runway_config
- congestion
- consistency
- modes
- runway_history
- weather
- stand_geometry
- stand_runway_lo
- modes5
- arrival_regime
- context_window
- gate_retention
- eurocontrol_daily
- adsb
- adsb_calib
- snow
train_label_cap: 10800
model:
  kind: lgbm
  params:
    learning_rate: 0.03
    num_leaves: 511
    min_data_in_leaf: 30
    max_bin: 511
    feature_fraction: 0.4
    lambda_l2: 50.0
    num_boost_round: 4000
    early_stopping_rounds: 200
folds: final_pairs
tags:
  family: tuning
