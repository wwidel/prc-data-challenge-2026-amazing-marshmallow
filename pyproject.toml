[project]
name = "taxiout"
version = "0.1.0"
description = "Taxi-out time prediction for the PRC Data Challenge 2026"
requires-python = ">=3.12,<3.14"
dependencies = [
    "polars>=1.30",
    "pyarrow>=17",
    "numpy>=2.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "mlflow>=2.17",
    "pyyaml>=6.0",
    "matplotlib>=3.11.2",
    "catboost>=1.2.10",
    "xgboost>=3.4.1",
    "orjson>=3.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
    "pip>=26.2.1",
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxiout"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
